<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 600 600" role="img" data-ui-kind="feedback"><title>TalkVela · Helpful feedback — illustrative app preview</title><rect x="1" y="1" width="598" height="598" rx="30" fill="#fbfaf4"/><rect x="1" y="1" width="598" height="598" rx="30" fill="none" stroke="#191919" stroke-opacity=".14"/><text x="36" y="51" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="700">TalkVela</text><text x="36" y="96" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="17" fill="#191919" >Helpful feedback</text><circle cx="550" cy="42" r="6" fill="#78a26a"/><g class="ui-stage" data-step="0" style="--step:0"><text x="36" y="160" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="23" fill="#191919" >A small change. A clearer sentence.</text></g><g class="ui-stage" data-step="0" style="--step:0"><rect x="36" y="188" width="528" height="81" rx="20" fill="#dfd7f2"/><text x="58" y="218" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >YOUR FIRST TRY</text><text x="58" y="254" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="500">I go there yesterday.</text></g><g class="ui-stage" data-step="1" style="--step:1"><rect x="36" y="287" width="528" height="81" rx="20" fill="#dcebd1"/><text x="58" y="317" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >TRY THIS</text><text x="58" y="353" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="500">I went there yesterday.</text></g><g class="ui-stage" data-step="2" style="--step:2"><text x="36" y="410" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="26" fill="#191919" >“Yesterday” tells us it happened</text><text x="36" y="447" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="26" fill="#191919" >in the past. Use “went”.</text><text x="36" y="492" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="23" fill="#191919" >Say the sentence again ↗</text></g></svg>