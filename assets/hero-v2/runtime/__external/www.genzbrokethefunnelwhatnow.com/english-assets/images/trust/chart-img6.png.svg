<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 600 600" role="img" data-ui-kind="lesson"><title>TalkVela · Everyday English — illustrative app preview</title><rect x="1" y="1" width="598" height="598" rx="30" fill="#fbfaf4"/><rect x="1" y="1" width="598" height="598" rx="30" fill="none" stroke="#191919" stroke-opacity=".14"/><text x="36" y="51" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="700">TalkVela</text><text x="36" y="96" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="17" fill="#191919" >Everyday English</text><circle cx="550" cy="42" r="6" fill="#78a26a"/><text x="36" y="155" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >AT THE CAFÉ</text><text x="36" y="199" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="26" fill="#191919" font-weight="600">You’re ordering a coffee.</text><g class="ui-stage" data-step="1" style="--step:1"><rect x="36" y="227" width="528" height="81" rx="20" fill="#dfd7f2"/><text x="58" y="257" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >YOU COULD SAY</text><text x="58" y="293" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="500">Could I get a coffee, please?</text></g><g class="ui-stage" data-step="2" style="--step:2"><rect x="36" y="330" width="528" height="81" rx="20" fill="#dcebd1"/><text x="58" y="360" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >KEEP IT GOING</text><text x="58" y="396" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="500">Could I have it to take away?</text></g><g class="ui-stage" data-step="3" style="--step:3"><text x="36" y="463" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="23" fill="#191919" >Speak. Listen. Try again.</text></g></svg>