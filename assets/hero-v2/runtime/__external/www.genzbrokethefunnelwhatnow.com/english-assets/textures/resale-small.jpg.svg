<svg xmlns="http://www.w3.org/2000/svg" width="281" height="188" viewBox="0 0 600 401.423487544484" role="img" data-ui-kind="feedback"><title>TalkVela · Helpful feedback — illustrative app preview</title><rect x="1" y="1" width="598" height="399.423487544484" rx="30" fill="#fbfaf4"/><rect x="1" y="1" width="598" height="399.423487544484" rx="30" fill="none" stroke="#191919" stroke-opacity=".14"/><text x="36" y="51" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="700">TalkVela</text><text x="36" y="84" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="17" fill="#191919" >Helpful feedback</text><circle cx="550" cy="42" r="6" fill="#78a26a"/><g class="ui-stage" data-step="0" style="--step:0"><text x="36" y="132" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="23" fill="#191919" >A small change. A clearer sentence.</text></g><g class="ui-stage" data-step="0" style="--step:0"><rect x="36" y="160" width="528" height="81" rx="20" fill="#dfd7f2"/><text x="58" y="190" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="14" fill="#191919" >YOUR FIRST TRY</text><text x="58" y="226" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="27" fill="#191919" font-weight="500">I go there yesterday.</text></g><g class="ui-stage" data-step="2" style="--step:2"><text x="36" y="283" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="26" fill="#191919" >“Yesterday” tells us it happened</text><text x="36" y="320" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="26" fill="#191919" >in the past. Use “went”.</text><text x="36" y="365" font-family="VogueAvantGarde,Helvetica,Arial,sans-serif" font-size="23" fill="#191919" >Say the sentence again ↗</text></g></svg>