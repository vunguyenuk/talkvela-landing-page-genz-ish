{\"className\":\"md:aspect-[1440/720] h-[35em] md:h-auto text-center relative text-brand-white py-12 flex items-center justify-center fluid-block\",\"children\":[[\"$\",\"div\",null,{\"className\":\"glitchy-image absolute inset-0\",\"children\":[[\"$\",\"div\",null,{\"className\":\"ornament-notfun-left absolute left-0 bottom-0 translate-x-[-50%] translate-y-[25%] w-[12em] lg:w-[24em] aspect-[38/48]\"}],[\"$\",\"div\",null,{\"className\":\"ornament-notfun-right absolute right-0 top-0 translate-x-[25%] translate-y-[-25%] w-[10em] lg:w-[20em] aspect-square\"}]]}],[\"$\",\"div\",null,{\"className\":\"overflow-clip text-center text-brand-white py-12 flex items-end justify-center relative w-full\",\"children\":[\"$\",\"div\",null,{\"className\":\"container relative w-full\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"sr-only\",\"children\":\"Knowing and speaking\"}],[\"$\",\"div\",null,{\"className\":\"mb-0 not-italic\",\"children\":[[\"$\",\"span\",null,{\"className\":\"block text-left pl-5 md:text-center md:pl-0\",\"children\":[\"$\",\"span\",null,{\"className\":\"inline-block align-bottom relative pr-5\",\"children\":[[\"$\",\"span\",null,{\"className\":\"font-normal uppercase h3 mb-4 inline-block align-bottom title1\",\"children\":\"Knowing\"}],[\"$\",\"div\",null,{\"className\":\"message-blob py-2 pb-1 px-4 fluid-text-xs font-vogue -tracking-[0.02em] rounded-md leading-[1.35] absolute left-full -top-3 tail-left bg-brand-sea text-white\",\"children\":[\"Let’s try\",[\"$\",\"svg\",null,{\"width\":\"17\",\"height\":\"21\",\"viewBox\":\"0 0 17 21\",\"fill\":\"none\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"className\":\"message-blob__tail absolute  -left-[3px] bottom-0 text-brand-sea\",\"children\":\"$L24\"}]]}]]}]}],\"$L25\",\"$L26\"]}]]}]}]]}],\"$L27\",null,null]}]}]\n2a:T119,\n    \u003cp class=\"text-body2\">A streak is a reason to open an app. \u003cmark class=\"mark-blue\">A real conversation is a reason to speak.\u003c/mark>\u003c/p>\n    \u003cp class=\"text-body3\">Practise answering, listening, asking for clarification, and finding another way to explain an idea.\u003c/p>\n    \n    19:[\"$\",\"$L14\",\"2\",{\"id\":\"ComponentSectionShoppingMindless\",\"data\":{\"description1\":\"$2a\",\"description2\":\"\u003cp class=\\\"text-body2\\\">A conversation gives you a reason to \u003cmark class=\\\"mark-green\\\">use the English you know\u003c/mark>.\u003c/p>\\n    \u003cp class=\\\"text-body3\\\">Start with one thought. Add a detail, ask a question, and see where it goes.\u003c/p>\",\"chart\":{\"title\":\"With \u003cmark class=\\\"mark-pink\\\">speaking practice\u003c/mark>, try another way to make your meaning clearer.\",\"data\":[{\"genz\":39,\"millennials\":37,\"label\":\"Clearer\",\"image\":{\"src\":\"/images/img.png\",\"width\":80,\"height\":80}},{\"genz\":38,\"millennials\":32,\"label\":\"More natural\",\"image\":{\"src\":\"/images/img-1.png\",\"width\":80,\"height\":80}},{\"genz\":30,\"millennials\":26,\"label\":\"More specific\",\"image\":{\"src\":\"/images/img-2.png\",\"width\":80,\"height\":80}},{\"genz\":30,\"millennials\":21,\"label\":\"A phrase that fits\",\"image\":{\"src\":\"/images/img-3.png\",\"width\":80,\"height\":80}},{\"genz\":27,\"millennials\":18,\"label\":\"A useful pause\",\"image\":{\"src\":\"/images/img-4.png\",\"width\":80,\"height\":80}},{\"genz\":23,\"millennials\":18,\"label\":\"A complete thought\",\"image\":{\"src\":\"/images/img-5.png\",\"width\":80,\"height\":80}},{\"genz\":23,\"millennials\":10,\"label\":\"A question back\",\"image\":{\"src\":\"/images/img-6.png\",\"width\":80,\"height\":80}},{\"genz\":23,\"millennials\":16,\"label\":\"A polite request\",\"image\":{\"src\":\"/images/img-7.png\",\"width\":80,\"height\":80}},{\"genz\":23,\"millennials\":14,\"label\":\"A clearer example\",\"image\":{\"src\":\"/images/img-8.png\",\"width\":80,\"height\":80}},{\"genz\":22,\"millennials\":15,\"label\":\"Your own words\",\"image\":{\"src\":\"/images/img-9.png\",\"width\":80,\"height\":80}},{\"genz\":21,\"millennials\":16,\"label\":\"Another attempt\",\"image\":{\"src\":\"/images/img-10.png\",\"width\":80,\"height\":80}}]},\"experience\":{\"title\":\"\u003cp class=\\\"text-body1\\\">A sample practice session: notice a useful correction, then try the sentence again. These demo scores illustrate feedback categories.\u003c/p>\",\"data\":[{\"percent\":79,\"label\":\"Sample practice score\",\"description\":\"Give an introduction in your own words.\"},{\"percent\":76,\"label\":\"Sample practice score\",\"description\":\"Add a detail about something you enjoy.\"},{\"percent\":70,\"label\":\"Sample practice score\",\"description\":\"Ask a question to keep the exchange going.\"}]},\"experience2\":{\"text\":\"\u003cp class=\\\"text-body2\\\">A sample practice session: choose a sentence, notice a useful change, and try it again. The scores below are illustrative.\u003c/p>\",\"data\":[{\"percent\":71,\"label\":\"Sample practice score\",\"description\":\"Explain the reason behind your opinion.\"},{\"percent\":51,\"label\":\"Sample practice score\",\"description\":\"Try a phrase in a new situation.\"},{\"percent\":48,\"label\":\"Sample practice score\",\"description\":\"Use a correction in your next answer.\"}]}},\"serverComponent\":\"$L2b\"}]\n2c:T143,\u003cp class=\"text-body3\">Mistakes show you what to practise next. They might be a missing ending, an unclear sound, or a phrase that does not quite fit the situation.\u003c/p>\u003cp class=\"text-body2\">Your tutor explains the point in context, then gives you another chance to use it. You can pause, repeat, or ask why.\u003c/p>\u003cspan>\u003c/span>2d:T12d,\u003cp class=\"text-body3\">You can ask your partner to slow down, repeat a question, or explain an unfamiliar word. Those are useful conversation skills too.\u003c/p>\u003cp class=\"text-body3\">Try saying: “Could you say that again?” or “Do you mean…?” Then keep going with the idea you wanted to share.\u003c/p>2e:T167,\u003cp class=\"text-body2\">Progress can be small and specific: \u003cmark class=\"mark-green\">a clearer sentence\u003c/mark>, a more natural phrase, or a reply you finish without starting over.\u003c/p>\u003cp class=\"text-body3\">Keep the expressions that helped you in a personal phrase bank. Bring them back in a new situation so they become part of your own English.\u003c/p>\u003cspan>\u003c/span>1a:[\"$\",\"$L14\",\"3\",{\"id\":\"ComponentSectionDoomshopping\",\"data\":{\"description1\":\"\u003cp class=\\\"text-body3\\\">A mistake can feel like the end of an answer. With TalkVela, it can be \u003cmark class=\\\"mark-pink\\\">the start of the next attempt\u003c/mark>.\u003c/p>\u003cp class=\\\"text-body2\\\">Get a short explanation, try the phrase, and return to your conversation.\u003c/p>\",\"description2\":\"$2c\",\"description2_2\":\"$2d\",\"infograph\":[{\"value\":32,\"description\":\"Sample score: make the main point clear.\",\"image\":{\"src\":\"/english-assets/images/img14-v1-7765ef20.png\",\"width\":106,\"height\":157,\"alt\":\"English speaking practice with TalkVela\"},\"imageMobile\":{\"src\":\"/english-assets/images/img14-m-v1-06a1477b.png\",\"width\":132,\"height\":134,\"alt\":\"English speaking practice with TalkVela\"}},{\"value\":52,\"description\":\"Sample score: add a useful detail.\",\"image\":{\"src\":\"/english-assets/images/img15-v1-9fa990b6.png\",\"width\":106,\"height\":157,\"alt\":\"English speaking practice with TalkVela\"},\"imageMobile\":{\"src\":\"/english-assets/images/img15-m-v1-fa4e0037.png\",\"width\":132,\"height\":134,\"alt\":\"English speaking practice with TalkVela\"}},{\"value\":66,\"description\":\"Sample score: choose a phrase that fits.\",\"image\":{\"src\":\"/english-assets/people/minh.png\",\"width\":106,\"height\":157,\"alt\":\"English speaking practice with TalkVela\"},\"imageMobile\":{\"src\":\"/english-assets/people/minh.png\",\"width\":132,\"height\":134,\"alt\":\"English speaking practice with TalkVela\"}},{\"value\":84,\"description\":\"Sample score: link your ideas together.\",\"image\":{\"src\":\"/english-assets/images/img17-v1-7a543c1f.png\",\"width\":96,\"height\":157,\"alt\":\"English speaking practice with TalkVela\"},\"imageMobile\":{\"src\":\"/english-assets/images/img17-m-v1-a3be644c.png\",\"width\":132,\"height\":134,\"alt\":\"English speaking practice with TalkVela\"}},{\"value\":87,\"description\":\"Sample score: finish your thought.\",\"image\":{\"src\":\"/english-assets/images/img18-v1-ee7a80f3.png\",\"width\":130,\"height\":157,\"alt\":\"English speaking practice with TalkVela\"},\"imageMobile\":{\"src\":\"/english-assets/images/img18-m-v1-06a1477b.png\",\"width\":132,\"height\":134,\"alt\":\"English speaking practice with TalkVela\"}}],\"doomImages\":[{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":216,\"height\":323,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":289,\"height\":251,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":210,\"height\":234,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":202,\"height\":305,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":213,\"height\":299,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":388,\"height\":180,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":216,\"height\":323,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":210,\"height\":234,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":213,\"height\":299,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":388,\"height\":180,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":202,\"height\":305,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":289,\"height\":251,\"alt\":\"English speaking practice with TalkVela\"},{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":210,\"height\":234,\"alt\":\"English speaking practice with TalkVela\"}],\"description3\":\"$2e\",\"description3_2\":\"\u003cp class=\\\"text-body2\\\">A useful phrase can make a situation feel \u003cmark class=\\\"mark-green\\\">more familiar\u003c/mark>.\u003c/p>\u003cp class=\\\"text-body3\\\">Save the English you want to use again, then practise it in another context. A phrase bank gives you something personal to come back to.\u003c/p>\",\"description4\":\"\u003cp class=\\\"text-body3\\\">Find a phrase that expresses your meaning. Then change a detail, give an example, or use it to ask a new question. Reusing English in different settings gives your practice a purpose.\u003c/p>\",\"description5\":\"\u003cp class=\\\"text-body3\\\">Some conversations call for a short answer. Others give you room to tell a story. Practise both, and ask your tutor for a prompt that fits your goal.\u003c/p>\u003cp class=\\\"text-body3\\\">You can return to a phrase when you need it. What sounded unfamiliar in one exchange can become something you choose to say in the next.\u003c/p>\",\"image\":{\"src\":\"/images/img13.png\",\"width\":362,\"height\":461},\"image2\":{\"src\":\"/images/img19.jpg\",\"width\":304,\"height\":507},\"image3\":{\"src\":\"/english-assets/photos/campus.jpg\",\"width\":303,\"height\":469,\"alt\":\"English speaking practice with TalkVela\"},\"image4\":{\"src\":\"/english-assets/photos/cafe.jpg\",\"width\":167,\"height\":250,\"alt\":\"English speaking practice with TalkVela\"},\"image5\":{\"src\":\"/english-assets/images/img23-v1-6d10de6b.png\",\"width\":492,\"height\":385,\"alt\":\"English speaking practice with TalkVela\"},\"doubleChart\":{\"data\":[{\"title\":\"Introduce yourself to someone new.\",\"value\":[68,51],\"image\":{\"src\":\"/english-assets/images/doom/chart-img1-v1-b8474d65.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Give a reason for your opinion.\",\"value\":[64,54],\"image\":{\"src\":\"/english-assets/images/doom/chart-img2-v1-b36b45b9.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Explain an idea to your team.\",\"value\":[63,54],\"image\":{\"src\":\"/english-assets/images/doom/chart-img3-v1-3d1758bd.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Ask a follow-up question.\",\"value\":[58,49],\"image\":{\"src\":\"/english-assets/images/doom/chart-img4-v1-d787c95b.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Find another way to say it.\",\"value\":[52,46],\"image\":{\"src\":\"/english-assets/images/doom/chart-img5-v1-e084878d.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Tell a story about your experience.\",\"value\":[45,31],\"image\":{\"src\":\"/english-assets/images/doom/chart-img6-v1-23b6f10c.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Ask for help politely.\",\"value\":[39,33],\"image\":{\"src\":\"/english-assets/images/doom/chart-img7-v1-b8474d65.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Answer an unexpected question.\",\"value\":[33,27],\"image\":{\"src\":\"/english-assets/images/doom/chart-img8-v1-b36b45b9.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}}]}},\"serverComponent\":\"$L2f\"}]\n30:T150,\n      \u003cp class=\"text-body3\">Tell Vela what you want to feel ready for: meeting a classmate, speaking in a team meeting, or answering an interview question.\u003c/p>\n      \u003cp class=\"text-body3\">Your starting point matters. Use the English you have now, and let the next question give you room to stretch.\u003c/p>\n      \n      \n      \n      \n    31:T151,\n        \u003cp class=\"text-body3\">Choose a question you could hear in real life. Say what you think, listen to the reply, and follow where the conversation goes.\u003c/p>\n        \u003cp class=\"text-body3\">Revisit the situation when you want another go. A different follow-up question gives you a new reason to use the same useful English.\u003c/p>\n      1b:[\"$\",\"$L14\",\"4\",{\"id\":\"ComponentSectionRecapturingMagic\",\"data\":{\"textBlock1\":{\"description\":\"\u003cp class=\\\"text-body1\\\">Practise \u003cmark class=\\\"mark-pink\\\">English\u003c/mark> by using it. Choose a goal, have a conversation, and take away something you can say again.\u003c/p>\"},\"textBlock2\":{\"description\":\"\",\"description2\":\"$30\"},\"textBlock3\":{\"description\":\"\\n      \u003cp class=\\\"text-body1\\\">The next question\u003c/p>\\n      \u003cp class=\\\"text-body3\\\">An introduction can become a story. A story can lead to an opinion. Your AI partner follows what you say and asks a question that gives you room to add more.\u003c/p>\\n      \u003cspan>\u003c/span>\\n    \",\"description2\":\"$31\"},\"image1\":{\"src\":\"/images/countermovement/img1.png\",\"width\":468,\"height\":538}},\"serverComponent\":\"$L32\"}]\n33:T10c,\n        \u003cp class=\"text-body1\">\u003cmark class=\"mark-pink\">Real\u003c/mark> situations\u003c/p>\n        \u003cp class=\"md:pr-8\">English becomes useful in ordinary moments: ordering a coffee, meeting a neighbour, explaining an idea, or asking someone to repeat a name.\u003c/p>\n        \n      34:T14c,\n        \u003cp class=\"text-body3\">A conversation rarely follows a script. The next question depends on what you said, so practise responding as well as remembering.\u003c/p>\n        \u003cp class=\"text-body2\">Give a reason, add an example, and ask a question back. These small moves help an exchange feel like a conversation.\u003c/p>\n        \n      1c:[\"$\",\"$L14\",\"5\",{\"id\":\"ComponentSectionDemandsIRL\",\"data\":{\"textBlock1\":{\"description\":\"$33\"},\"textBlock2\":{\"description\":\"\\n      \u003cp class=\\\"text-body3\\\">“Could you tell me a little more about that?” A small follow-up can turn a sentence into a conversation.\u003c/p>\\n    \"},\"textBlock3\":{\"description\":\"\\n      \u003cp class=\\\"text-body1\\\">Everyday English\u003c/p>\\n      \u003cp class=\\\"text-body3\\\">Ask for a recommendation, explain a problem, or make a plan. Practise the moments that make a new place feel more familiar.\u003c/p>\\n      \u003cspan>\u003c/span>\\n      \",\"description2\":\"$34\"},\"textBlock4\":{\"description\":\"\\n      \u003cp class=\\\"text-body3 md:pr-6\\\">Prepare for a conversation you expect to have. Try an answer, ask for feedback, and say it again in a way that feels right to you.\u003c/p>\\n      \u003cspan>\u003c/span>\\n\\n    \",\"description2\":\"\\n      \u003cp class=\\\"text-body3\\\">Find a situation that fits your goal: a group project, your first day at work, or a conversation with someone you have just met.\u003c/p>\\n      \u003cp class=\\\"text-body3\\\">Try asking a question as well as answering one. A useful exchange gives both people somewhere to go next.\u003c/p>\\n    \"},\"chartImage\":{\"src\":\"/english-assets/images/content-chart1-v1-246ca457.png\",\"width\":527,\"height\":266,\"alt\":\"English speaking practice with TalkVela\"},\"doubleChart\":{\"title\":\"Choose a practice situation. The example below compares two illustrative attempts at expressing the same idea.\",\"data\":[{\"title\":\"Meeting someone new\",\"value\":[64,36]},{\"title\":\"Sharing an idea\",\"value\":[60,40]},{\"title\":\"Ordering a coffee\",\"value\":[52,48]},{\"title\":\"Asking for directions\",\"value\":[44,56]},{\"title\":\"Making a plan\",\"value\":[42,58]}]}},\"serverComponent\":\"$L35\"}]\n36:Tdd,\u003cp class=\"text-body1\">\u003cmark class=\"mark-green\">Room\u003c/mark> to try\u003c/p>\u003cp class=\"text-body2\">Your practice space is somewhere to work things out. Take a pause, change your mind, or start your answer again.\u003c/p>\n      \n      37:Tc8,\u003cp class=\"text-body1\">The follow-up question\u003c/p>\u003cp class=\"text-body2\">A first answer is a start. “Why?”, “What happened next?”, and “Can you give an example?” help you take it further.\u003c/p>38:Tff,\u003cp class=\"text-body3\">You can practise a short answer before building a longer one. Start with the main point.\u003c/p>\n      \u003cp class=\"text-body3\">Then add a reason: “I chose it because…” or “The part I enjoyed most was…”.\u003c/p>\n      \n      \n      39:T14d,\u003cp class=\"text-body2\">Learning a phrase is useful. \u003cmark class=\"mark-green\">Using it in your own answer\u003c/mark> is the next step.\u003c/p>\n      \u003cp class=\"text-body3\">A small correction can change the meaning of a sentence. Hear the difference between “I work here since June” and “I have worked here since June”.\u003c/p>\n      \n      3a:Tf3,\u003cp class=\"text-body1\">\u003cmark class=\"mark-pink\">Helpful\u003c/mark> feedback\u003c/p>\u003cp class=\"text-body3\">A reply can be understandable and still have room to become clearer. Your tutor helps you notice a useful next step.\u003c/p>\n      \n      \n      \n      3b:Tcb,\u003cp class=\"text-body1\">Your \u003cmark class=\"mark-blue\">own\u003c/mark> pace\u003c/p>\u003cp class=\"text-body2\">Some days you have a lot to say. Other days, a quick exchange is enough. Start where you are.\u003c/p>\n      \n      1d:[\"$\",\"$L14\",\"6\",{\"id\":\"ComponentSectionTrustsQuiter\",\"data\":{\"image1\":{\"src\":\"/images/img24.png\",\"width\":358,\"height\":566,\"alt\":\"Trusts Quiter Image\"},\"messages\":[\"I have an interview tomorrow. Can we practise introducing myself?\",\"Of course. Tell me a little about yourself.\",\"I study design and I enjoy working with other people.\",\"Nice start. Could you add an example of something you have worked on?\",\"I helped my class team build a simple website.\"],\"textBlock1\":{\"description\":\"$36\"},\"textBlock2\":{\"description\":\"$37\"},\"doubleChart\":{\"title\":\"What do you want to get better at in your next conversation?\",\"data\":[{\"title\":\"Pronunciation\",\"value\":[55,54],\"image\":{\"src\":\"/english-assets/images/trust/chart-img1-v1-23b6f10c.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Grammar in context\",\"value\":[52,45],\"image\":{\"src\":\"/english-assets/images/trust/chart-img2-v1-b36b45b9.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Useful phrases\",\"value\":[42,33],\"image\":{\"src\":\"/english-assets/images/trust/chart-img3-v1-d787c95b.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Longer answers\",\"value\":[37,41],\"image\":{\"src\":\"/english-assets/images/trust/chart-img4-v1-23b6f10c.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Listening and replying\",\"value\":[38,30],\"image\":{\"src\":\"/english-assets/images/trust/chart-img5-v1-b36b45b9.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Asking questions\",\"value\":[38,30],\"image\":{\"src\":\"/english-assets/images/trust/chart-img6-v1-d787c95b.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Finding your words\",\"value\":[26,28],\"image\":{\"src\":\"/english-assets/images/trust/chart-img7-v1-23b6f10c.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}}]},\"textBlock3\":{\"description\":\"$38\"},\"textBlock4\":{\"description\":\"$39\"},\"textBlock5\":{\"description\":\"$3a\"},\"textBlock6\":{\"description\":\"$3b\"}},\"serverComponent\":\"$L3c\"}]\n3d:Ted,\u003cp class=\"text-body1\">\u003cmark class=\"mark-pink\">English\u003c/mark> for your life\u003c/p>\u003cp class=\"text-body3\">Your reasons for learning English shape the situations you want to practise. TalkVela starts with those reasons.\u003c/p>\n      \n      \n      3e:Tb3,\u003cp class=\"text-body1\">Practice with a purpose\u003c/p>\u003cp class=\"text-body3\">Prepare for the conversations that matter to you, from a first hello to a first interview.\u003c/p>\n      \n      3f:T14a,\u003cp class=\"text-body2\">Choose the situation you want to practise and the kind of help you need. These examples show possible learning goals, rather than research findings.\u003c/p>\n      \u003cp class=\"text-body3\">You might want to give a clearer update, speak more politely, or tell a story with a beginning and an ending.\u003c/p>\n      \n      1e:[\"$\",\"$L14\",\"7\",{\"id\":\"ComponentSectionGravitatesToMore\",\"data\":{\"textBlock1\":{\"description\":\"$3d\"},\"textBlock2\":{\"description\":\"$3e\"},\"textBlock3\":{\"description\":\"$3f\"},\"textBlock4\":{\"description\":\"\u003cp class=\\\"text-body3\\\">English practice should help you say something that matters to you. Bring your goals, your interests, and the stories you want to tell.\u003c/p>\"},\"chart1\":{\"title\":\"What would you like to practise next? Explore these example goals. Chart values are illustrative demo data.\",\"data\":[{\"title\":\"Meeting new people\",\"value\":[54,39]},{\"title\":\"Everyday conversations\",\"value\":[46,39]},{\"title\":\"First interviews\",\"value\":[46,36]},{\"title\":\"Sharing an opinion\",\"value\":[44,32]},{\"title\":\"Small talk\",\"value\":[44,29]},{\"title\":\"Life abroad\",\"value\":[42,29]},{\"title\":\"Working with a team\",\"value\":[41,28]},{\"title\":\"Giving an update\",\"value\":[39,36]},{\"title\":\"Telling a story\",\"value\":[34,31]},{\"title\":\"Answering questions\",\"value\":[28,25]}]},\"chart2\":{\"title\":\"Find a useful next step for your English. These examples show possible areas of practice, with illustrative demo scores.\",\"data\":[{\"title\":\"Introduce yourself with a little more detail.\",\"value\":[54,48],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img1-v1-b89d01e9.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Share an idea in a group conversation.\",\"value\":[51,43],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img2-v1-97fe56f3.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Explain a problem and ask for help.\",\"value\":[51,39],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img3-v1-cde353f8.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Tell a short story about your experience.\",\"value\":[47,44],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img4-v1-b89d01e9.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Ask a question politely at work.\",\"value\":[46,41],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img5-v1-97fe56f3.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Rehearse an answer for your interview.\",\"value\":[39,38],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img6-v1-cde353f8.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Find a natural phrase for what you mean.\",\"value\":[37,32],\"image\":{\"src\":\"/english-assets/images/gravitates/chart2-img7-v1-b89d01e9.png\",\"width\":30,\"height\":30,\"alt\":\"English speaking practice with TalkVela\"}}]}},\"serverComponent\":\"$L40\"}]\n41:T14c,\u003cp class=\"text-body3\">Your AI tutor starts with what you say. It can ask another question, suggest a phrase, or explain a correction in the context of your reply.\u003c/p>\n      \u003cp class=\"text-body2\">You keep the decisions: what to practise, what you want to say, and whether you want to try again.\u003c/p>\n      \n      \n      \n      \n      1f:[\"$\",\"$L14\",\"8\",{\"id\":\"ComponentSectionWorldOfSearch\",\"data\":{\"description1\":\"\\n    \u003cp class=\\\"text-body1\\\">Your AI tutor responds to \u003cmark class=\\\"mark-blue\\\">your own words\u003c/mark>. Ask a question, try a phrase, and get help that stays connected to the conversation.\u003c/p>\",\"description2\":\"\\n    \u003cp class=\\\"text-body1\\\">Learning English is about more than recognising the right answer. It is about \u003cmark class=\\\"mark-pink\\\">having something to say\u003c/mark> and finding a way to say it. TalkVela gives you a place to practise that process.\u003c/p>\",\"textBlock1\":{\"description\":\"$41\"},\"textBlock2\":{\"description\":\"\u003cp class=\\\"text-body3\\\">Start with a question you want to be able to answer. Try “Tell me about yourself”, “What do you think?”, or “How can I help?”.\u003c/p>\",\"description2\":\"\u003cp class=\\\"text-body3\\\">Use the feedback that helps you express your meaning. Then take another turn in the conversation.\u003c/p>\\n      \u003cp class=\\\"text-body3\\\">Bring a topic you care about. An idea, an experience, or a plan gives your English a purpose.\u003c/p>\\n      \u003cp class=\\\"text-body2\\\">Practise the exchange before you need it, then return whenever you want another attempt.\u003c/p>\"},\"textBlock3\":{\"description\":\"\u003cp class=\\\"text-body3\\\">You do not need to wait until your English feels perfect to start talking.\u003c/p>\\n      \u003cp class=\\\"text-body2\\\">Choose a situation, give it a go, and find one useful thing to try next.\u003c/p>\\n      \u003cp class=\\\"text-body3\\\">Keep a phrase you want to remember and use it in another conversation.\u003c/p>\\n      \u003cp class=\\\"text-body2\\\">Your next conversation starts with the English you have today.\u003c/p>\\n      \"},\"doubleChart\":{\"title\":\"What would you like your AI English tutor to help you practise?\",\"data\":[{\"title\":\"Introduce myself\",\"value\":[54,58],\"image\":{\"src\":\"/english-assets/images/search/img1-v1-3d1758bd.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Explain an idea\",\"value\":[51,60],\"image\":{\"src\":\"/english-assets/images/search/img2-v1-d787c95b.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Answer a follow-up question\",\"value\":[46,54],\"image\":{\"src\":\"/english-assets/images/search/img3-v1-e084878d.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Ask for help\",\"value\":[44,52],\"image\":{\"src\":\"/english-assets/images/search/img4-v1-23b6f10c.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Tell a story\",\"value\":[42,46],\"image\":{\"src\":\"/english-assets/images/search/img5-v1-b8474d65.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Get ready for my first interview\",\"value\":[40,42],\"image\":{\"src\":\"/english-assets/images/search/img6-v1-b36b45b9.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Find a phrase for what I mean\",\"value\":[39,47],\"image\":{\"src\":\"/english-assets/images/search/img7-v1-3d1758bd.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Give a clear update at work\",\"value\":[35,39],\"image\":{\"src\":\"/english-assets/images/search/img8-v1-d787c95b.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}},{\"title\":\"Keep a conversation going\",\"value\":[32,40],\"image\":{\"src\":\"/english-assets/images/search/img9-v1-e084878d.png\",\"width\":150,\"height\":150,\"alt\":\"English speaking practice with TalkVela\"}}]},\"finalBlock\":{\"description\":\"\u003cp class=\\\"text-body2\\\">TalkVela is your AI English speaking partner. Practise real situations, get helpful feedback, and try again at your own pace.\u003c/p>\u003cp class=\\\"text-body3\\\">Explore how it works \u003ca href=\\\"#article-2\\\">here\u003c/a>.\u003c/p>\"}},\"serverComponent\":\"$L42\"}]\n43:I[1356,[\"654\",\"static/chunks/654-c6e4278057aa3ea4-english-a892f98a0d-native-r60.js\",\"974\",\"static/chunks/app/page-282a3b5a1f362993-english-378969a842.js\"],\"Image\"]\n46:I[615,[\"654\",\"static/chunks/654-c6e4278057aa3ea4-english-a892f98a0d-native-r60.js\",\"974\",\"static/chunks/app/page-282a3b5a1f362993-english-378969a842.js\"],\"default\"]\n51:I[8841,[\"654\",\"static/chunks/654-c6e4278057aa3ea4-english-a892f98a0d-native-r60.js\",\"974\",\"static/chunks/app/page-282a3b5a1f362993-english-378969a842.js\"],\"default\"]\n20:[\"$\",\"p\",null,{\"className\":\"mt-8 !font-vogue text-body3\",\"children\":[\"By\",\" \",[\"$\",\"a\",null,{\"href\":\"#article-2\",\"target\":\"_blank\",\"className\":\"underline text-current!\",\"rel\":\"noopener noreferrer\",\"children\":\"TalkVela\"}],\", \",\"\",[\"$\",\"br\",null,{\"className\":\"md:hidden\"}],\"Your AI English tutor\"]}]\n21:[\"$\",\"div\",null,{\"className\":\"py-20\",\"children\":[\"$\",\"div\",null,{\"className\":\"outfits-block fluid-block relative h-[200vh] md:h-auto xl:h-[200vh]\",\"children\":[[\"$\",\"div\",null,{\"className\":\"trailing-images fixed inset-0 pointer-events-none z-5 opacity-0 xl:opacity-100\",\"children\":[[\"$\",\"$L43\",\"0\",{\"src\":\"/assets/hero-v2/runtime/__external/www.genzbrokethefunnelwhatnow.com/english-assets/cursor/1.png\",\"alt\":\"English speaking practice with TalkVela\",\"width\":102,\"height\":186,\"priority\":true,\"unoptimized\":true,\"loading\":\"eager\",\"className\":\"trailing-image w-25 h-auto opacity-0 scale-0 abso
